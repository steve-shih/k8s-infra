apiVersion: batch/v1
kind: CronJob
metadata:
  name: petbar-cleanup-vods
  namespace: petbar
spec:
  schedule: "0 * * * *" # Every hour
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: petbar-cleanup
            image: ghcr.io/steve-shih/petlive-backend:main
            imagePullPolicy: Always
            command: ["python", "cleanup_vods.py"]
            env:
            - name: NODE_ENV
              value: "production"
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: db-secrets
                  key: PETLIVE_MONGO_URI
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: "/app/secrets/gcp-service-account.json"
            volumeMounts:
            - name: gcp-secrets
              mountPath: /app/secrets
              readOnly: true
          volumes:
          - name: gcp-secrets
            secret:
              secretName: db-secrets
          restartPolicy: OnFailure
