# ==============================================================================
# 檔案名稱 (File): prod/proxy-server.yaml
# 負責组件 (Component): 基礎設施 - 獨立 Proxy 服務 (Proxy Server)
# 檔案用途 (Purpose): 定義 Namespace proxy-system、Deployment (GOST 支援 SOCKS5 與 HTTP 雙協定) 與 LoadBalancer Service
# 相依資源 (Dependencies): 無
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: proxy-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: proxy-system
data:
  config.json: |
    {
      "serviceName": "proxy-server",
      "namespace": "proxy-system",
      "ports": {
        "socks5": 1080,
        "http": 8888
      },
      "auth": {
        "enabled": false
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-server
  namespace: proxy-system
  labels:
    app: proxy-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-server
  template:
    metadata:
      labels:
        app: proxy-server
    spec:
      containers:
        - name: gost-proxy
          image: ginuerzh/gost:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-L"
            - "socks5://:1080"
            - "-L"
            - "http://:8888"
          ports:
            - containerPort: 1080
              name: socks5
            - containerPort: 8888
              name: http
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/proxy-config
      volumes:
        - name: config-volume
          configMap:
            name: proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: proxy-system
spec:
  type: LoadBalancer
  selector:
    app: proxy-server
  ports:
    - name: socks5
      port: 1080
      targetPort: 1080
    - name: http
      port: 8888
      targetPort: 8888
