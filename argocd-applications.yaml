# ==============================================================================
# 檔案名稱 (File): argocd-applications.yaml
# 負責組件 (Component): ArgoCD GitOps 獨立空間管理
# 檔案用途 (Purpose): 為每一個獨立功能模組與基礎設施開闢專屬 ArgoCD Application 獨立空間
# 相依資源 (Dependencies): 依賴 argocd namespace
# ==============================================================================

# 1. 獨立基礎設施：Proxy Server
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: proxy-system
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/steve-shih/k8s-infra.git'
    targetRevision: main
    path: prod
    directory:
      include: 'proxy-server.yaml'
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: proxy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
